# Local dev services. `docker compose up -d redis` is optional: without it the API
# falls back to an in-process cache (docs/08-operations/LOCAL_DEVELOPMENT.md).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    profiles: ["api"] # opt in: `docker compose --profile api up`
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Dev settings: prod settings force an HTTPS redirect that breaks plain-HTTP local use.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
