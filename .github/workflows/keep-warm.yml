# Render's free tier sleeps after 15 min idle. This pings /health every 10 min so a shared
# demo link opens fast. Disable the workflow in the Actions tab when you stop sharing the demo.
# See docs/08-operations/DEPLOYMENT.md §1.
name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "API_HEALTH_URL is not set: nothing to ping."
          else
            curl --fail --silent --show-error --max-time 90 --output /dev/null "$API_HEALTH_URL"
            echo "API is awake."
          fi
